<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>高性能電卓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="高性能電卓">
    <section class="display-area">
      <div id="expression" class="expression" aria-live="polite"></div>
      <div id="display" class="display" aria-live="polite">0</div>
      <div id="status" class="status"></div>
    </section>

    <section class="keys" id="keys">
      <button class="key function" data-action="clear">AC</button>
      <button class="key function" data-action="backspace">⌫</button>
      <button class="key function" data-action="percent">%</button>
      <button class="key operator" data-action="operator" data-value="÷">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key operator" data-action="operator" data-value="×">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key operator" data-action="operator" data-value="−">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key operator" data-action="operator" data-value="+">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>

    <p class="hint">キーボード対応：0–9 / + − * / / Enter / Backspace / Esc</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
